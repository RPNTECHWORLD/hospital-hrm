AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation Template for Hospital HRM Production EC2 Server'

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
    Description: 'EC2 Instance Type for Hospital HRM'

  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-050c78efa486a0196
    Description: 'Ubuntu Server 24.04 LTS AMI ID in ap-south-1'

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: hospital-hrm-aws-key
    Description: 'EC2 KeyPair for SSH access'

Resources:
  HospitalHrmSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for Hospital HRM server allowing SSH, Web, and API traffic'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: 'SSH Access'
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'HTTP Web Traffic'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'HTTPS Web Traffic'
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0
          Description: 'Express API Backend Port'
      Tags:
        - Key: Name
          Value: hospital-hrm-sg

  HospitalHrmServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref HospitalHrmSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/user-data.log 2>&1

          echo "Starting Hospital HRM Server bootstrap..."
          export DEBIAN_FRONTEND=noninteractive

          # Update and install dependencies
          apt-get update -y
          apt-get install -y curl git ufw nginx

          # Install Node.js 20 LTS
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          npm install -g pm2

          # Configure Nginx reverse proxy
          cat << 'NGINX_CONF' > /etc/nginx/sites-available/default
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }
          NGINX_CONF

          systemctl restart nginx
          systemctl enable nginx

          # Prepare app directory
          mkdir -p /var/www/hospital-hrm
          chown -R ubuntu:ubuntu /var/www/hospital-hrm

          echo "Bootstrap completed successfully."
      Tags:
  HospitalHrmElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref HospitalHrmServer
      Tags:
        - Key: Name
          Value: hospital-hrm-eip
        - Key: Project
          Value: Hospital-HRM

Outputs:
  InstanceId:
    Description: 'EC2 Instance ID'
    Value: !Ref HospitalHrmServer

  ElasticIp:
    Description: 'Permanent Static Elastic IP Address'
    Value: !Ref HospitalHrmElasticIp

  PublicIp:
    Description: 'Public IP Address of the Hospital HRM Server'
    Value: !Ref HospitalHrmElasticIp

  PublicDns:
    Description: 'Public DNS Name of the Hospital HRM Server'
    Value: !GetAtt HospitalHrmServer.PublicDnsName

  ApiUrl:
    Description: 'Backend API URL'
    Value: !Sub 'http://${HospitalHrmElasticIp}:5000'

  WebUrl:
    Description: 'Web Service URL (via Nginx reverse proxy on port 80)'
    Value: !Sub 'http://${HospitalHrmElasticIp}'
